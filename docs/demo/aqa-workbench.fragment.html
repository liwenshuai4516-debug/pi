$('#aw-content').innerHTML=`<header class="aw-head"><div><h1>插件中心</h1><div class="aw-sub">为工作台增加专门能力。</div></div><span class="aw-badge">生态规划 · 示例目录</span></header><section class="aw-page"><h2>按需扩展你的工作台。</h2><p class="aw-page-lead">安装前查看来源与权限，工具在需要时才进入任务上下文。</p><div class="aw-row" style="margin-bottom:20px"><input class="aw-field" id="aw-plugin-search" style="flex:1" aria-label="搜索插件" placeholder="搜索插件名称…" value="${esc(pluginQuery)}"><select class="aw-field" id="aw-plugin-filter" aria-label="插件分类" style="width:auto">${[['all','全部'],['preview','文件预览'],['context','上下文'],['data','数据']].map(([v,t])=>`<option value="${v}" ${pluginFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="aw-grid" id="aw-plugin-grid"></div><div class="aw-mini-note">这里是 AQA 的能力设计示例，不是已上线市场，不保证兼容 pi-web-ui 插件包。启用仅改变原型状态。</div></section>`;
pluginGrid();
}
function pluginGrid(){const list=plugins.filter(p=>p.name.toLowerCase().includes(pluginQuery.toLowerCase())&&(pluginFilter==='all'||p.group===pluginFilter));$('#aw-plugin-grid').innerHTML=list.map(p=>`<article class="aw-plugin"><div class="aw-row"><span class="aw-role">${I(p.icon)}</span><span class="aw-sub">AQA 示例</span></div><h3>${p.name}</h3><p>${p.desc}</p><div class="aw-sub">权限：${p.permission}</div><div class="aw-row"><span class="aw-badge${enabled.has(p.id)?' good':''}">${enabled.has(p.id)?'已启用':'未启用'}</span><button class="aw-button${enabled.has(p.id)?'':' primary'}" data-plugin="${p.id}">${enabled.has(p.id)?'停用':'查看并启用'}</button></div></article>`).join('')||'<p class="aw-sub">没有匹配的插件。</p>';icons();}
function settings(){
$('#aw-content').innerHTML=`<header class="aw-head"><div><h1>设置</h1><div class="aw-sub">模型、运行环境与外观</div></div><span class="aw-badge">本地配置</span></header><section class="aw-page"><div class="aw-setting"><h2>连接模型，保持掌控。</h2><p class="aw-page-lead">默认使用 DeepSeek，Agent 在本地 Pi SDK 中运行。</p><div class="aw-agent-card"><div class="aw-row"><div class="aw-agent-name">${I('sparkles')}DeepSeek</div><span class="aw-badge good">默认供应商</span></div></div><label class="aw-label" for="aw-key">API Key</label><input id="aw-key" class="aw-field" type="password" value="demo-only-not-a-key" readonly><div class="aw-sub" style="margin-top:6px">演示凭证，请勿输入真实 Key</div><label class="aw-label" for="aw-model">模型</label><input id="aw-model" class="aw-field" value="DeepSeek · 具体型号待接入验证" readonly><label class="aw-label">Agent 引擎</label><div class="aw-field">Pi SDK · 进程内嵌</div><div class="aw-sub" style="margin-top:6px">供应商与 Agent 引擎独立；当前不切换 DSH / Claude 引擎。</div><label class="aw-label">外观与语言</label><div class="aw-row"><span class="aw-badge">${I('sun')}浅色</span><span class="aw-badge">简体中文</span><span class="aw-sub">不随系统主题切换</span></div><div class="aw-row" style="margin-top:25px">${B('检查连接','connect','plug')}${B('保存配置','save-settings','check',true)}</div><div class="aw-sub" id="aw-connection" role="status" style="margin-top:12px">${connected?'模拟连接成功，未发送网络请求。':''}</div><div class="aw-mini-note">正式产品中凭据由 macOS 安全存储保护。选定消息及文件上下文会发送给模型服务；本地文件优先不等于离线模型。</div></div></section>`;
}
function openDialog(name){dialog=name;renderDialog();icons();$('#aw-dialog-area').querySelector('button,input')?.focus();}
function renderDialog(){const area=$('#aw-dialog-area');area.hidden=!dialog;if(!dialog){area.innerHTML='';return;}
let title='',content='',actions='';
if(dialog==='workspace'){title='打开工作区';content=`<p class="aw-sub" style="margin-top:7px">选择本地项目、SSH 服务器或沙盒副本。</p><div class="aw-agent-card"><div class="aw-row"><span>${I('folder-open')} qa-workspace</span>${B('打开','local')}</div><div class="aw-sub" style="margin-top:6px">~/Projects/qa-workspace</div></div><div class="aw-row">${B('远程 SSH 项目','ssh','server')}${B('创建沙盒副本','sandbox','box')}</div>`;}
else if(dialog==='ssh'){title='连接远程项目';content=`<p class="aw-sub" style="margin-top:7px">仅演示连接配置，不访问服务器。</p><label class="aw-label" for="aw-host">服务器</label><input id="aw-host" class="aw-field" value="example.test" readonly><label class="aw-label" for="aw-user">用户名 / 认证</label><input id="aw-user" class="aw-field" value="qa · SSH Agent（演示）" readonly><label class="aw-label" for="aw-remote-path">项目路径</label><input id="aw-remote-path" class="aw-field" value="/workspace/demo" readonly>`;actions=B('模拟连接并打开','ssh-connect','plug',true);}
else if(dialog==='sandbox'){title='创建沙盒副本';content=`<p class="aw-sub" style="margin-top:9px">从 qa-workspace 创建独立的演示副本，原项目保持原状。</p><div class="aw-mini-note">来源：~/Projects/qa-workspace<br>目标：~/Projects/qa-workspace-sandbox<br>保留方式：手动删除</div><div class="aw-alert">原型不复制文件。正式产品的文件副本不等同于操作系统安全沙箱。</div>`;actions=B('创建并打开副本','sandbox-create','box',true);}
else if(dialog==='command'){title='确认执行命令';content=`<p class="aw-sub" style="margin-top:7px">${environment==='ssh'?'远程示例环境':'本地示例环境'} · 当前项目</p><pre class="aw-code" style="padding:15px;background:#f5f7fb;border-radius:6px;margin-top:13px">${esc(termCommand)}</pre><div class="aw-alert">测试脚本可能读取文件或产生报告。此原型只展示固定模拟输出，不会运行命令。</div>`;actions=B('取消','close')+B('允许执行（模拟）','run-test','play',true);}
else if(dialog==='picker'){title='拾取网页元素';content=`<p class="aw-sub" style="margin-top:6px">点击示例登录按钮，预览发送给 Agent 的元素上下文。</p><div class="aw-browser"><div class="aw-browser-bar">${I('globe')} preview.example.test/login · 示例网页</div><div class="aw-login"><h3>欢迎回来</h3><div class="aw-field" style="margin-top:9px">账号</div><div class="aw-field" style="margin-top:9px">密码</div><button class="aw-picker-target" data-action="pick">${pickerSelected?I('check')+' 已选中 · 登录按钮':'点选此元素：登录'}</button></div></div>${pickerSelected?'<div class="aw-mini-note">选择器：button[type="submit"]<br>元素：登录按钮 · 当前为示例，不采集真实浏览器页面。</div>':''}`;actions=B('加入任务上下文','attach-picker','paperclip',true,pickerSelected?'':'disabled');}
else if(dialog.startsWith('plugin:')){const p=plugins.find(p=>p.id===dialog.split(':')[1]);title='启用 '+p.name;content=`<p style="margin-top:10px">${p.desc}</p><div class="aw-mini-note">来源：AQA 原型示例<br>请求权限：${p.permission}<br>未下载或运行任何插件代码。</div>`;actions=`<button class="aw-button primary" data-enable="${p.id}">确认启用（模拟）</button>`;}
else if(dialog==='summary'){title='上下文压缩摘要';content=`<div class="aw-doc"><h3>保留的目标</h3><p>${esc(s().task||'新任务')}</p><h3>文件引用</h3><p>${esc(s().refs.join('、')||'无')}</p><h3>保留的约束</h3><p>写入与命令前确认；提交前审查；账号锁定规则待确认。</p></div>`;actions=B('应用摘要（模拟）','apply-summary','check',true);}
area.innerHTML=`<section class="aw-dialog" role="region" aria-label="${esc(title)}"><div class="aw-row" style="justify-content:space-between"><h2>${title}</h2><button class="aw-quiet aw-icon" data-action="close" aria-label="关闭面板">${I('x')}</button></div>${content}${actions?`<div class="aw-card-actions" style="justify-content:flex-end">${actions}</div>`:''}</section>`;
}
function newSession(fork=false){const prev=s();const id=Math.max(...sessions.map(x=>x.id))+1;sessions.push({id,title:fork?prev.title+' · 分支':'新会话',phase:'idle',task:'',draft:fork?prev.task:'',mode:'plan',scope:'核心登录流程',refs:fork?[...prev.refs]:[],events:fork?['从会话创建分支；未重放工具']:[]});sessionId=id;view='workbench';render();saveView();}
root.addEventListener('input',e=>{
const t=e.target;if(t.id==='aw-prompt')s().draft=t.value;
if(t.id==='aw-search'){fileQuery=t.value;tree();icons();}
if(t.id==='aw-editor'){drafts[selected]=t.value;$('#aw-dirty').textContent=t.value===fileData[selected]?'内存示例文件 · 不写入本机':'未保存修改';}
if(t.id==='aw-commit-message'){commitMessage=t.value;$('[data-action="commit"]').disabled=!staged.size||!commitMessage.trim();}
if(t.id==='aw-plugin-search'){pluginQuery=t.value;pluginGrid();}
});
root.addEventListener('change',e=>{if(e.target.id==='aw-mode')s().mode=e.target.value;if(e.target.id==='aw-plugin-filter'){pluginFilter=e.target.value;pluginGrid();}if(e.target.id==='aw-collab-mode')toast('已选择 '+e.target.value+'；原型不启动自动编排。');});
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||b.disabled||!root.contains(b))return;
$('#aw-feedback').hidden=true;
if(b.dataset.view){view=b.dataset.view;dialog='';render();saveView();return;}
if(b.dataset.session){sessionId=Number(b.dataset.session);view='workbench';render();return;}
if(b.dataset.file){selected=b.dataset.file;panel='file';inspector=true;view='workbench';editor=drafts[selected]!==undefined;render();return;}
if(b.dataset.panel){panel=b.dataset.panel;inspector=true;view='workbench';render();saveView();return;}
if(b.dataset.dialog){openDialog(b.dataset.dialog);return;}
if(b.dataset.term){termTab=b.dataset.term;renderTerminal();icons();return;}
if(b.dataset.stage){const f=b.dataset.stage;if(staged.has(f))staged.delete(f);else staged.add(f);gitPanel();icons();return;}
if(b.dataset.diff){diffFile=b.dataset.diff;gitPanel();icons();return;}
if(b.dataset.plugin){if(enabled.has(b.dataset.plugin)){enabled.delete(b.dataset.plugin);pluginGrid();}else openDialog('plugin:'+b.dataset.plugin);return;}
if(b.dataset.enable){enabled.add(b.dataset.enable);dialog='';render();toast('已在原型中启用，没有安装插件。');return;}
switch(b.dataset.action){
case 'sidebar':root.classList.toggle('show-sidebar');break;
case 'new':newSession();break;
case 'fork':newSession(true);toast('已创建会话分支，没有重放工具。');break;
case 'inspector':inspector=!inspector;render();break;
case 'template':s().draft=sampleTask;chat();icons();$('#aw-prompt').focus();break;
case 'reference':if(!s().refs.includes(selected))s().refs.push(selected);s().draft=(s().draft?s().draft+'\n':'')+'@'+selected+' ';view='workbench';render();$('#aw-prompt').focus();toast('文件引用已加入当前草稿。');break;
case 'send':{const task=s().draft.trim();if(!task){toast('请先输入任务。');break;}if(task==='/new'){newSession();break;}if(task==='/compact'){openDialog('summary');break;}s().task=task;s().title=s().title==='新会话'?'登录测试 · 新任务':s().title;s().draft='';s().phase='question';s().events.push('已提交任务，等待澄清');render();break;}
case 'answer':s().scope=$('input[name="aw-scope"]:checked').value;s().phase=s().mode==='plan'?'plan':'write';s().events.push('覆盖范围：'+s().scope);render();break;
case 'approve-plan':s().phase='write';s().events.push('用户已批准计划');render();break;
case 'reject':s().phase='rejected';s().events.push('用户拒绝本次文件写入');render();break;
case 'write':fileData['tests/login.spec.ts']=proposal;selected='tests/login.spec.ts';panel='file';editor=false;s().phase='complete';s().events.push('已模拟创建 tests/login.spec.ts');render();break;
case 'stop':clearTimeout(timers.get(sessionId));s().phase='stopped';s().events.push('用户停止任务，待确认操作失效');render();break;
case 'artifact':selected='tests/login.spec.ts';panel='file';inspector=true;editor=false;render();break;
case 'git':panel='git';inspector=true;render();break;
case 'edit':editor=true;drafts[selected]??=fileData[selected];filePanel();icons();break;
case 'preview':editor=false;filePanel();icons();break;
case 'save-file':fileData[selected]=drafts[selected]??fileData[selected];delete drafts[selected];staged.delete(selected);s().events.push('已保存示例文件 '+selected);render();toast('已保存到原型内存，没有写入本机文件。');break;
case 'commit':if(staged.size&&commitMessage.trim()){lastCommit=commitMessage.trim();for(const f of staged)baseline[f]=fileData[f];staged.clear();commitMessage='';render();toast('模拟提交完成，仅更新原型中的暂存状态。');}break;
case 'terminal':terminal=!terminal;render();break;
case 'request-test':openDialog('command');break;
case 'run-test':{dialog='';terminal=true;termTab='agent';termState='running';termLog='$ '+termCommand+'\n[模拟] 正在执行示例验证…';const owner=s();owner.events.push('用户批准模拟命令');render();clearTimeout(termTimer);termTimer=setTimeout(()=>{termState='complete';termLog='$ '+termCommand+'\n[模拟日志] 1 passed · 2 pending\n正常登录与密码错误场景待补充。\nProcess exited with code 0 (simulated)';owner.events.push('模拟验证结束：1 passed / 2 pending');if(view==='workbench'){if(terminal){renderTerminal();icons();}if(panel==='trace'&&inspector){inspect();icons();}}},650);break;}
case 'stop-terminal':clearTimeout(termTimer);termState='stopped';termLog+='\n[模拟] 用户停止命令，未继续执行。';renderTerminal();icons();break;
case 'compress':openDialog('summary');break;
case 'apply-summary':compressed=true;dialog='';s().events.push('已应用模拟上下文摘要，保留原记录');render();break;
case 'back-workbench':view='workbench';render();break;
case 'delegate':delegated=true;workerStopped=false;render();toast('模拟委派：分析者已回传结论，执行者等待操作确认。');break;
case 'stop-workers':workerStopped=true;render();toast('模拟执行者已停止，未启动真实 Agent。');break;
case 'review-agent':sessionId=2;view='workbench';render();break;
case 'connect':connected=true;$('#aw-connection').textContent='✓ 模拟连接成功，未发送网络请求。';break;
case 'save-settings':if(!connected)toast('请先检查模拟连接。');else toast('配置已在本次原型中确认，未保存真实凭据。');break;
case 'local':environment='local';project='qa-workspace';dialog='';render();break;
case 'ssh':openDialog('ssh');break;
case 'ssh-connect':environment='ssh';project='remote-demo';dialog='';render();toast('已切换远程环境展示，未连接服务器。');break;
case 'sandbox':openDialog('sandbox');break;
case 'sandbox-create':environment='sandbox';project='qa-workspace-sandbox';dialog='';render();toast('已切换沙盒环境展示，未创建文件副本。');break;
case 'pick':pickerSelected=true;renderDialog();icons();break;
case 'attach-picker':if(pickerSelected){s().refs.push('网页：button[type="submit"]');s().draft+='\n请分析这个登录按钮的交互。';dialog='';view='workbench';render();toast('示例选择器已加入任务上下文。');}break;
case 'close':dialog='';renderDialog();break;
}
});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog='';renderDialog();}if(e.target.id==='aw-prompt'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!active())$('[data-action="send"]')?.click();}if((e.metaKey||e.ctrlKey)&&e.key==='s'&&e.target.id==='aw-editor'){e.preventDefault();$('[data-action="save-file"]')?.click();}});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v&&['workbench','agents','plugins','settings'].includes(v.view)){view=v.view;if(['file','git','trace'].includes(v.panel))panel=v.panel;render();}});
render();
if(globalThis.Tweak){const prefs={inspector:true};const tweak=new Tweak({container:root,onChange:()=>{inspector=prefs.inspector;render();}});tweak.addToggle(prefs,'inspector',{label:'显示文件与变更面板'});}
})();
</script>
