   <main class="main"><header class="main-head"><div><h1 id="aq-title">登录功能测试用例</h1><div class="path" id="aq-path">qa-demo / 本地工作目录</div></div><div class="model"><span class="model-dot"></span>DeepSeek</div></header><div class="body" id="aq-body"></div><div class="composer-wrap" id="aq-composer-wrap"><div class="composer"><textarea id="aq-input" aria-label="任务内容" placeholder="可以先编辑下一条消息…"></textarea><div class="composer-bottom"><span class="folder-chip"><i data-lucide="folder" aria-hidden="true"></i>qa-demo</span><button class="button" id="aq-send" data-action="send"><i data-lucide="square" aria-hidden="true"></i>停止</button></div></div><div class="hint"><span>Enter 发送 · Shift + Enter 换行</span><span>文件写入前需要确认</span></div></div><div id="aq-toast" class="toast" role="status" hidden></div></main>

<script>
(()=>{
const root=document.getElementById('aqa-prototype');
const body=root.querySelector('#aq-body'), input=root.querySelector('#aq-input'), toast=root.querySelector('#aq-toast');
const initial=window.openai?.widgetState?.privateContent||{};
const valid=['welcome','settings','approval','complete','running','stopped','rejected'];
let screen=valid.includes(initial.screen)?initial.screen:'approval', task='阅读 requirements.md，生成登录功能测试用例，保存为 login-test-cases.md。', timer=null, connected=false, expanded=false;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const mark=`<span class="agent-badge">A</span>`;
const doc=['# 登录功能测试用例','','## TC-001 · 正确账号和密码','前置条件：账号已注册且状态正常。','步骤：输入正确账号和密码，点击登录。','预期：登录成功，进入首页。','','## TC-002 · 密码错误','步骤：输入正确账号与错误密码，点击登录。','预期：显示错误提示，保持未登录状态。'];
function persist(){window.openai?.setWidgetState?.({modelContent:{product:'AQA',screen},privateContent:{screen}})?.catch(()=>{});}
function notify(message){toast.textContent=message;toast.hidden=false;}
function setScreen(next){clearTimeout(timer);timer=null;screen=next;expanded=false;toast.hidden=true;render();persist();}
function docHtml(){return doc.slice(0,expanded?doc.length:6).map((line,i)=>`<div class="doc-line"><span>${i+1}</span><span>${line.startsWith('#')?'<strong>'+escape(line)+'</strong>':escape(line)||'&nbsp;'}</span></div>`).join('');}
function tool(){return `<details class="tool"><summary>${icon('circle-check')}<span>已读取 <b>requirements.md</b></span><span class="chev">详情 ${icon('chevron-down')}</span></summary><div class="tool-detail">路径：~/Documents/qa-demo/requirements.md<br>示例需求：支持账号密码登录；密码错误时保持未登录状态。文件读取完成。</div></details>`;}
function thread(){return `<div class="msg-label">你 <time>刚刚</time></div><div class="user-message">${escape(task)}</div><div class="msg-label">${mark} AQA <time>DeepSeek</time></div>`;}
function render(){
root.querySelectorAll('.demo-tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.screen===screen);b.setAttribute('aria-pressed',String(b.dataset.screen===screen));});
const active=screen==='approval'||screen==='running';
root.querySelector('#aq-composer-wrap').hidden=screen==='settings';
root.querySelector('#aq-title').textContent=screen==='settings'?'设置':screen==='welcome'?'新建会话':'登录功能测试用例';
root.querySelector('#aq-path').textContent=screen==='settings'?'模型与连接':screen==='welcome'?'选择目录，开始你的下一项任务':'~/Documents/qa-demo';
root.querySelector('#aq-session-status').textContent=({approval:'等待写入确认',complete:'已完成 · 1 个文件',running:'正在读取文件',stopped:'已停止',rejected:'写入已拒绝'})[screen]||'最近的会话';
root.querySelector('#aq-send').innerHTML=icon(active?'square':'arrow-up')+(active?'停止':'发送');
root.querySelector('#aq-send').classList.toggle('primary',!active);
input.placeholder=active?'可以先编辑下一条消息…':'输入任务，或继续补充你的需求…';
if(screen==='settings'){
 body.innerHTML=`<section class="settings"><div class="agent-badge">A</div><h2>连接你的模型</h2><p>让 AQA 帮你理解文件，完成下一步工作。</p><div class="provider">${icon('sparkles')}<div><div class="file-name">DeepSeek</div><div class="sub">模型服务</div></div><span class="pill" style="background:var(--aq-bluebg);color:var(--aq-blue)">默认供应商</span></div><label for="aq-key">API Key</label><input class="field" id="aq-key" type="password" value="demo-placeholder-only" readonly aria-describedby="aq-key-help"><div class="sub" id="aq-key-help" style="margin-top:7px">演示凭证 · 请勿在原型中输入真实 API Key</div><label for="aq-model">模型</label><input id="aq-model" class="field" value="DeepSeek · 演示模型" readonly><div class="sub" style="margin-top:7px">具体型号将在 SDK 接入验证后确定。</div><div class="setting-actions"><button class="button" data-action="connect">${icon('plug')}检查连接</button><button class="button primary" data-action="save">保存并继续 ${icon('arrow-right')}</button></div><div id="aq-connect-status" class="sub" role="status" style="margin-top:12px">${connected?'模拟连接成功，未发起网络请求。':''}</div><div class="privacy">${icon('shield-check')} 正式产品将安全保存凭证。消息及任务所需文件内容将发送至 DeepSeek，文件保存在本地。</div></section>`;
}else if(screen==='welcome'){
 body.innerHTML=`<section class="welcome"><div class="brand-mark">A</div><h2>从本地文件，开始下一步。</h2><p>读懂一份需求，整理一个想法，或完成一份文档。<br>选择工作目录，把任务交给 AQA。</p><div class="folder-select">${icon('folder-open')}<div><div class="file-name">qa-demo</div><div class="sub">~/Documents/qa-demo</div></div><button class="button" data-action="folder">选择目录</button></div><div class="sub">可读取目录内文本，写入文件前会请你确认。</div><div class="suggestions"><button class="button" data-task="总结 requirements.md 中的功能需求和未明确事项。">${icon('file-text')}总结需求</button><button class="button" data-task="阅读 requirements.md，生成登录功能测试用例，保存为 login-test-cases.md。">${icon('list-checks')}生成测试用例</button><button class="button" data-task="阅读 requirements.md，整理需要进一步确认的问题。">${icon('list-todo')}整理待办</button></div></section>`;
}else{
let content=thread();
if(screen==='running') content+=`<p class="agent-text">我会先读取需求文件，整理正常流程与异常场景。</p><div class="tool"><summary>${icon('loader-circle')}正在读取 requirements.md</summary></div><div class="status-line" role="status">正在执行示例任务…</div>`;
else if(screen==='approval') content+=`<p class="agent-text">已阅读需求，整理了登录成功与密码错误两个场景。<br>准备将测试用例保存为以下文件，请确认内容。</p>${tool()}<section class="confirm"><div class="confirm-top"><div class="file-icon">${icon('file-text')}</div><div><div class="file-name">login-test-cases.md</div><div class="sub">新建文件 · qa-demo</div></div><span class="pill">${icon('clock-3')}等待确认</span></div><div class="preview"><div class="preview-head"><span>内容预览 · Markdown</span><span>新增 10 行</span></div><div class="document">${docHtml()}</div><button class="quiet" data-action="expand" style="margin-top:9px">${icon(expanded?'chevron-up':'expand')}${expanded?'收起内容':'查看完整内容'}</button></div><div class="confirm-foot"><span class="sub">仅在你允许后写入此文件</span><div class="row"><button class="button" data-action="reject">拒绝</button><button class="button primary" data-action="approve">${icon('check')}允许写入</button></div></div></section><div class="status-line"><span class="status-dot"></span>等待你的确认，尚未写入文件</div>`;
else if(screen==='complete') content+=`${tool()}<p class="agent-text">测试用例已整理完成，并保存到工作目录。</p><div class="result-summary">本次覆盖<ul><li>正确账号与密码：登录成功并进入首页</li><li>密码错误：提示错误并保持未登录状态</li></ul></div><div class="notice"><strong>还有一项需要确认</strong>需求尚未说明连续登录失败的锁定规则，暂未编写对应断言。</div><section class="confirm"><div class="confirm-top"><div class="file-icon">${icon('file-check-2')}</div><div><div class="file-name">login-test-cases.md</div><div class="sub">~/Documents/qa-demo</div></div><span class="pill" style="color:var(--aq-green);background:var(--aq-greenbg)">${icon('check')}已保存</span></div><div class="confirm-foot"><span class="sub">新建文件 · 10 行</span><div class="row"><button class="button" data-action="copy-path">${icon('copy')}复制路径</button><button class="button" data-action="finder">${icon('folder-open')}在 Finder 中显示</button></div></div></section><div class="row" style="margin-top:14px"><button class="quiet" data-action="copy-answer">${icon('copy')}复制回答</button><span class="sub">本轮已完成</span></div>`;
else content+=`${tool()}<div class="notice"><strong>${screen==='stopped'?'任务已停止':'本次写入已被拒绝'}</strong>${screen==='stopped'?'没有新建文件。已读取的内容和执行记录仍然保留。':'文件未修改。你可以补充要求，我会调整内容后再次请你确认。'}</div>`;
body.innerHTML=`<div class="thread">${content}</div>`;
}
globalThis.lucide?.createIcons({attrs:{width:17,height:17}});
}
async function copy(text){try{await navigator.clipboard.writeText(text);notify('已复制示例内容。');}catch{notify('预览环境不支持剪贴板，示例路径：~/Documents/qa-demo/login-test-cases.md');}}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.screen){setScreen(b.dataset.screen);return;}
 if(b.dataset.task){input.value=b.dataset.task;input.focus();return;}
 switch(b.dataset.action){
 case 'new':if(screen==='running'||screen==='approval'){notify('当前任务尚未结束，请先完成确认或停止任务。');break;}setScreen('welcome');input.value='';break;
 case 'session':setScreen('approval');break;
 case 'folder':notify('目录选择演示：已选中 ~/Documents/qa-demo，未访问你的文件系统。');break;
 case 'connect':connected=true;root.querySelector('#aq-connect-status').textContent='✓ 模拟连接成功，未发起网络请求。';break;
 case 'save':if(!connected){notify('请先点击“检查连接”体验配置流程。');break;}setScreen('welcome');break;
 case 'expand':expanded=!expanded;render();break;
 case 'approve':setScreen('complete');break;
 case 'reject':setScreen('rejected');break;
 case 'send':if(screen==='approval'||screen==='running'){setScreen('stopped');break;}if(!input.value.trim()){notify('请先输入任务，或选择一个示例任务。');input.focus();break;}task=input.value.trim();input.value='';setScreen('running');timer=setTimeout(()=>setScreen('approval'),1100);break;
 case 'copy-path':copy('~/Documents/qa-demo/login-test-cases.md');break;
 case 'copy-answer':copy('测试用例已整理完成，覆盖登录成功与密码错误场景。连续失败的锁定规则仍需确认。');break;
 case 'finder':notify('正式产品将在 Finder 中定位文件；此处展示模拟结果，未生成真实文件。');break;
 }
});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!['approval','running'].includes(screen))root.querySelector('#aq-send').click();}});
root.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();root.querySelector('[data-action="new"]').click();}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.screen;if(valid.includes(s)){clearTimeout(timer);screen=s;render();}});
render();
if(globalThis.Tweak){const design={radius:14,sidebar:210};const tweak=new Tweak({container:root,onChange:()=>{root.querySelector('.window').style.borderRadius=design.radius+'px';root.style.setProperty('--aq-sidebar-width',design.sidebar+'px');}});tweak.addSlider(design,'radius',{label:'窗口圆角',min:6,max:22,unit:'px'});tweak.addSlider(design,'sidebar',{label:'侧栏宽度',min:180,max:250,unit:'px'});}
})();
</script>
<style>@media(min-width:761px){#aqa-prototype .shell{grid-template-columns:var(--aq-sidebar-width,210px) minmax(0,1fr)}}</style>
